<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-label="KeepSupabaseAlive - self-hosted health checks for free-tier Supabase projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="glow" x1="800" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3ecf8e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ecf8e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- Logo -->
  <circle cx="160" cy="180" r="72" fill="#3ecf8e" fill-opacity="0.08"/>
  <circle cx="160" cy="180" r="52" stroke="#3ecf8e" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M128 208 L160 148 L192 208" stroke="#3ecf8e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="224" r="12" fill="#3ecf8e"/>
  <circle cx="160" cy="224" r="18" stroke="#3ecf8e" stroke-opacity="0.35"/>
  <path d="M100 246 H220" stroke="#3ecf8e" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 246 C132 230, 148 254, 160 246 S188 230, 208 246" stroke="#3ecf8e" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Title -->
  <text
    x="280"
    y="128"
    fill="#fafafa"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="700"
  >KeepSupabaseAlive</text>

  <!-- Subtitle -->
  <text
    x="280"
    y="168"
    fill="#a1a1aa"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="400"
  >Self-hosted health checks for free-tier Supabase projects</text>

  <!-- Tech pills (separate, no overlap) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3ecf8e">
    <rect x="280" y="288" width="108" height="32" rx="16" fill="#3ecf8e" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4"/>
    <text x="298" y="309">Next.js 16</text>

    <rect x="400" y="288" width="100" height="32" rx="16" fill="#3ecf8e" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4"/>
    <text x="418" y="309">shadcn/ui</text>

    <rect x="512" y="288" width="88" height="32" rx="16" fill="#3ecf8e" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4"/>
    <text x="530" y="309">Docker</text>

    <rect x="612" y="288" width="88" height="32" rx="16" fill="#3ecf8e" fill-opacity="0.12" stroke="#3ecf8e" stroke-opacity="0.4"/>
    <text x="630" y="309">Coolify</text>
  </g>
</svg>
